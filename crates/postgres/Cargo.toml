[package]
name = "datafusion-table-providers-postgres"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion postgres table provider"

[dependencies]
arrow = { workspace = true }
arrow-json = { workspace = true }
arrow-schema = { workspace = true }
async-stream = "0.3"
async-trait = "0.1"
bb8 = "0.9"
bb8-postgres = "0.9"
bigdecimal = "0.4"
byteorder = "1.5"
chrono = "0.4.44"
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
fallible-iterator = "0.3"
futures = "0.3"
geo-types = "0.7"
logos = "0.16"
native-tls = { version = "0.2", optional = true }
pem = { version = "4.0", optional = true }
postgres-native-tls = { version = "0.5.0", optional = true }
rust_decimal = { version = "1.38", features = ["db-postgres"] }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
sea-query = { version = "1.0.0", features = ["backend-postgres", "postgres-array", "with-rust_decimal", "with-bigdecimal", "with-time", "with-chrono"] }
secrecy = "0.10"
serde_json = "1.0"
snafu = "0.9"
tokio = { version = "1.52", features = ["macros", "fs"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1", "with-geo-types-0_7"] }
tokio-postgres-rustls = { workspace = true, optional = true }
tracing = "0.1"
uuid = { version = "1.18" }
url = "2.5"
webpki-roots = { workspace = true, optional = true }

[features]
default = ["federation", "native-tls"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]
native-tls = ["dep:native-tls", "dep:pem", "dep:postgres-native-tls"]
# Takes precedence over native-tls when both are enabled.
rustls = [
  "dep:rustls",
  "dep:rustls-pemfile",
  "dep:rustls-pki-types",
  "dep:tokio-postgres-rustls",
  "dep:webpki-roots",
]

[dev-dependencies]
geozero = { version = "0.15.1", features = ["with-wkb"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
